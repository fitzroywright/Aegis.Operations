[Unit]
RequiresMountsFor=/mnt/ffpmanager-data
BindsTo=mnt-ffpmanager\x2ddata.mount
After=mnt-ffpmanager\x2ddata.mount

[Service]
TimeoutStartSec=45
ExecStartPre=/usr/bin/findmnt --noheadings --raw --mountpoint /mnt/ffpmanager-data --types cifs --source //nas01.fftpj.local/ffpmanager_data --options rw
