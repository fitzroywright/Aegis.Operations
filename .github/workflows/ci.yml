name: Aegis Operations CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Aegis.Operations.csproj
      - run: dotnet build Aegis.Operations.csproj --no-restore --configuration Release
