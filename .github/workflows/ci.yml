name: Aegis Operations CI
on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aegis.Operations
        uses: actions/checkout@v4
        with:
          path: Aegis.Operations

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: 4f90c9fd31aaa16ffbada97e33084a5356a45859
          path: Common/Common.Diagnostics

      - name: Checkout Common.Security
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: 3d7cd6238427fb6897425415baabe2443c8c5b99
          path: Common/Common.Security

      - name: Checkout Common.Registration
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: e673815b7e1f29ac1c713e849762e1af522a784d
          path: Common/Common.Registration

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: Aegis.Operations
        shell: bash
        run: |
          set +e
          dotnet restore Aegis.Operations.csproj -p:CommonRoot="${{ github.workspace }}/Common" 2>&1 | tee restore.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Build
        id: build
        working-directory: Aegis.Operations
        shell: bash
        run: |
          set +e
          dotnet build Aegis.Operations.csproj --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -m1 -E '(: error |error (CS|MSB|NU)[0-9]+)' build.log | tr '\n' ' ' | cut -c1-130 > first-error.txt || true
          fi
          exit "$code"

      - name: Restore tests
        if: steps.build.outcome == 'success'
        working-directory: Aegis.Operations
        run: dotnet restore Aegis.Operations.Tests/Aegis.Operations.Tests.csproj -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Test operational semantics
        if: steps.build.outcome == 'success'
        working-directory: Aegis.Operations
        run: dotnet test Aegis.Operations.Tests/Aegis.Operations.Tests.csproj --no-restore --configuration Release -p:CommonRoot="${{ github.workspace }}/Common"

      - name: Publish build diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            state=success
            description="Aegis.Operations build passed"
          else
            state=failure
            description="$(cat Aegis.Operations/first-error.txt 2>/dev/null || echo 'Aegis.Operations build failed')"
          fi
          description="$(printf '%s' "$description" | cut -c1-140)"
          payload="$(jq -n --arg state "$state" --arg context "aegis/build" --arg description "$description" --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -d "$payload" || echo "warning: commit status publishing unavailable"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            Aegis.Operations/restore.log
            Aegis.Operations/build.log
          if-no-files-found: ignore
